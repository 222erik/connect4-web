<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Four</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/themes.css">
</head>

<body>
    <div id="app">
        <!-- Login Screen -->
        <div id="login-screen" class="screen active">
            <div class="login-container">
                <h1>Connect Four</h1>
                <p>Enter a username to play</p>
                <input type="text" id="username-input" placeholder="Username" maxlength="20">
                <button id="login-btn" class="btn primary">Play</button>
                <button id="anonymous-btn" class="btn secondary">Play Anonymously</button>
                <p class="anonymous-note">Anonymous players can only play against the bot</p>
            </div>
        </div>

        <!-- Main Menu -->
        <div id="menu-screen" class="screen">
            <header>
                <div class="header-left">
                    <span id="player-name">Guest</span>
                    <span class="online-dot"></span>
                </div>
                <div class="header-right">
                    <button id="theme-toggle" class="icon-btn" title="Toggle theme">?</button>
                </div>
            </header>

            <main>
                <div class="action-buttons">
                    <button id="find-match-btn" class="btn primary large auth-only">Invite a random player</button>
                    <button id="bot-match-btn" class="btn secondary large">Play vs Bot</button>
                </div>

                <div class="menu-stats">
                    <span id="menu-stat-plays">0 plays</span>
                    <span class="menu-stats-sep">|</span>
                    <span id="menu-stat-wins">0 wins</span>
                </div>

                <div class="online-players auth-only">
                    <h3>Online Players <span id="player-count">(0)</span>
                        <button id="refresh-players-btn" class="refresh-btn" title="Refresh">↻</button>
                    </h3>
                    <ul id="players-list"></ul>
                </div>
            </main>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <header>
                <div class="header-left">
                    <button id="leave-game-btn" class="icon-btn">X</button>
                    <span id="game-opponent">vs Opponent</span>
                </div>
                <div class="header-right">
                    <span id="turn-indicator">Your Turn</span>
                </div>
            </header>

            <main>
                <div class="game-status">
                    <div class="player-info red">
                        <span class="piece red"></span>
                        <span id="player1-name">Player 1</span>
                    </div>
                    <div class="vs">VS</div>
                    <div class="player-info yellow">
                        <span class="piece yellow"></span>
                        <span id="player2-name">Player 2</span>
                    </div>
                </div>

                <div id="game-board">
                    <!-- Board will be generated by JS -->
                </div>

                <div class="game-actions">
                    <button id="emoji-btn" class="icon-btn" title="Send reaction">?</button>
                </div>

                <div id="emoji-picker" class="hidden">
                    <button class="emoji" data-emoji="👍">👍</button>
                    <button class="emoji" data-emoji="😂">😂</button>
                    <button class="emoji" data-emoji="😮">😮</button>
                    <button class="emoji" data-emoji="🔥">🔥</button>
                    <button class="emoji" data-emoji="💀">💀</button>
                    <button class="emoji" data-emoji="🎉">🎉</button>
                    <button class="emoji" data-emoji="😢">😢</button>
                    <button class="emoji" data-emoji="🤔">🤔</button>
                </div>
            </main>
        </div>

        <!-- Invite Modal -->
        <div id="invite-modal" class="modal hidden">
            <div class="modal-content">
                <h3>Game Invite</h3>
                <p id="invite-message">Player wants to play!</p>
                <div class="modal-actions">
                    <button id="accept-invite-btn" class="btn primary">Accept</button>
                    <button id="decline-invite-btn" class="btn secondary">Decline</button>
                </div>
            </div>
        </div>

        <!-- Game Over Modal -->
        <div id="gameover-modal" class="modal hidden">
            <div class="modal-content">
                <h3 id="gameover-title">Game Over</h3>
                <p id="gameover-message"></p>
                <div class="stats">
                    <div class="stat">
                        <span class="stat-value" id="stat-wins">0</span>
                        <span class="stat-label">Wins</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="stat-plays">0</span>
                        <span class="stat-label">Played</span>
                    </div>
                </div>
                <button id="play-again-btn" class="btn primary">Play Again</button>
            </div>
        </div>

        <!-- Notification Toast -->
        <div id="notification" class="notification hidden"></div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/websocket.js"></script>
    <script src="js/game.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
